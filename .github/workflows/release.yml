name: Release

on:
  push:
    tags: ["v*"]
  # Builds and signs the PPA source packages for the version in
  # debian/changelog; uploads them only when asked (e.g. to retry a
  # release's upload without moving its tag).
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to the PPA"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-version.sh

  # Source only: the module is built per kernel by DKMS, so there are no
  # binary archives, and OS packages are published through their own
  # repositories below, never as release assets.
  github:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "removablefs ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}

  ppa:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { series: jammy, release: "22.04" }
          - { series: noble, release: "24.04" }
          - { series: resolute, release: "26.04" }
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q devscripts debhelper dput-ng
      - name: Import signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_KEY_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_KEY_PASSPHRASE }}
          FPR: ${{ vars.PACKAGE_SIGNING_KEY_FINGERPRINT }}
        run: |
          [ -n "$PACKAGE_SIGNING_KEY" ] && [ -n "$FPR" ] ||
            { echo "::error::PACKAGE_SIGNING_KEY or PACKAGE_SIGNING_KEY_FINGERPRINT is not set"; exit 1; }
          gpg --batch --import <<<"$PACKAGE_SIGNING_KEY"
          gpg --list-secret-keys "$FPR" >/dev/null
          # Give gpg-agent the passphrase over stdin, so signing needs no
          # pinentry and the passphrase never lands in a file.
          echo allow-preset-passphrase >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          for grip in $(gpg --with-keygrip --with-colons -K "$FPR" | awk -F: '/^grp/ {print $10}'); do
            /usr/lib/gnupg/gpg-preset-passphrase --preset "$grip" <<<"$PACKAGE_SIGNING_KEY_PASSPHRASE"
          done
          echo "KEYID=$FPR" >> "$GITHUB_ENV"
      - name: Build and sign source package
        run: |
          base="$(dpkg-parsechangelog -S Version)"
          version="${base}~ubuntu${{ matrix.release }}.1"
          export DEBFULLNAME="Will Rouesnel" DEBEMAIL="wrouesnel@wrouesnel.com"
          dch -b -v "$version" -D "${{ matrix.series }}" "Release ${base} for Ubuntu ${{ matrix.release }}."
          dpkg-buildpackage -S -d -nc -us -uc
          debsign -k"$KEYID" "../removablefs_${version}_source.changes"
          gpg --verify "../removablefs_${version}_source.changes"
          echo "CHANGES=../removablefs_${version}_source.changes" >> "$GITHUB_ENV"
      - name: Upload to ppa:w-rouesnel/removablefs
        if: github.event_name == 'push' || inputs.upload
        run: dput ppa:w-rouesnel/removablefs "$CHANGES"

  copr:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger COPR build
        run: |
          pipx install copr-cli
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          copr-cli buildscm --clone-url "https://github.com/${GITHUB_REPOSITORY}" \
            --commit "$GITHUB_REF_NAME" --method make_srpm wrouesnel/removablefs
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
